<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mening Mini App</title>
  <!-- Telegram Web App kutubxonasi (majburiy) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      padding: 20px;
    }
    button {
      background: var(--tg-theme-button-color);
      color: var(--tg-theme-button-text-color);
      border: none; padding: 12px 20px; border-radius: 8px; width: 100%;
    }
  </style>
</head>
<body>
  <h2>Salom, <span id="name"></span>!</h2>
  <button onclick="yuborish()">Botga ma'lumot yuborish</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();    // Telegramga "tayyorman" deymiz
    tg.expand();   // To'liq ekranga ochish

    // Foydalanuvchi ma'lumoti
    document.getElementById("name").innerText =
      tg.initDataUnsafe?.user?.first_name || "Mehmon";

    function yuborish() {
      tg.sendData(JSON.stringify({ action: "buyurtma", mahsulot: "olma" }));
      // sendData dan keyin Mini App avtomatik yopiladi
    }
  </script>
</body>
</html>
